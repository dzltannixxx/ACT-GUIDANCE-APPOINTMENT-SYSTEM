<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ACT Guidance Appointment System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/act-logo.png" alt="ACT Senior High School Bulacao Campus">
                <span>ACT Bulacao Campus</span>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="index.html#about">About</a>
                <a href="index.html#services">Services</a>
                <a href="index.html#appointments">Appointments</a>
                <a href="index.html#contact">Contact</a>
            </nav>
            <div class="nav-buttons">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary">Register</a>
                <a href="counselor-login.html" class="btn btn-dark">Counselor Login</a>
            </div>
        </div>
    </header>

    <main class="form-section">
        <div class="form-box">
            <div class="form-heading">
                <img src="assets/act-logo.png" alt="ACT" style="width:70px;margin:0 auto 10px;">
                <h2>Create an Account</h2>
                <span>Register to book guidance appointments.</span>
            </div>
            <form id="registerForm">
                <label for="rname">Full Name</label>
                <input id="rname" type="text" placeholder="Enter your full name" required>
                <label for="rid">Student ID</label>
                <input id="rid" type="text" placeholder="Enter your student ID" required>
                <label for="remail">Email</label>
                <input id="remail" type="email" placeholder="Enter your email" required>
                <label for="rpass">Password</label>
                <input id="rpass" type="password" placeholder="Create a password" minlength="6" required>
                <label for="rpass2">Confirm Password</label>
                <input id="rpass2" type="password" placeholder="Re-enter your password" required>
                <button type="submit" class="full-button">Register</button>
            </form>
            <p class="form-bottom">Already have an account? <a id="loginLink" href="login.html">Login</a></p>
            <p class="form-bottom"><a href="index.html">Back to home</a></p>
        </div>
    </main>

    <script>
        var allowed = ['book-appointment.html', 'student-dashboard.html'];
        var next = new URLSearchParams(location.search).get('redirect');
        var q = allowed.indexOf(next) > -1 ? '?redirect=' + encodeURIComponent(next) : '';
        document.getElementById('loginLink').href = 'login.html' + q;
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            if (document.getElementById('rpass').value !== document.getElementById('rpass2').value) {
                alert('Passwords do not match.');
                return;
            }
            alert('Account created! Please log in.');
            location.href = 'login.html' + q;
        });
    </script>

</body>
</html>
